<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk Escolar - Abrir Chamado</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topo">
        <div class="topo">
            <span class="topo-conteudo">Help Desk Escolar</span>
            <nav class="topo-nav">
                <a href="index.html" class="ativo">Abrir Chamado</a>
                <a href="chamados.html">Ver chamados</a>
            </nav>
        </div>
    </header>

    <main class="conteudo">
        <div class="cartao">
            <h1>Abrir novo chamado</h1>
            <p class="subtitulo">Descreva o problema encontrado na escola. A equipe responsável vai analisar e atualizar
                o status.</p>

            <form id="form-chamado" novalidate>
                <div class="campo">
                    <label for="setor">Nome do solicitante</label>
                    <input type="text" id="setor" name="setor" placeholder="EX: Sala 12, Laboratório 2, Secretaria"
                        required />
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" name="prioridade" required>
                        <option value="" disable selected>Selecione</option>
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="descricao">Descrição do problema</label>
                    <textarea id="descricao" name="descricao" row="4"
                        placeholder="explique com detalhes o que está acontecendo" required></textarea>


                </div>

                <button type="submit" class="botao principal">Registrar chamado</button>
                <P id="mensagem-status" class="mensagem-status" role="status" aria-live="polite"></P>


            </form>
        </div>
    </main>



    <script scr="storage.js"></script>
    <script scr="app.js"></script>



</body>

</html>
